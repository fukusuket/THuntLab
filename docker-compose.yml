services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-server
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./shared:/shared
    working_dir: /shared
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - JENKINS_OPTS=--httpPort=8080
      - MISP_URL=http://misp-nginx:8080
    restart: unless-stopped
    networks:
      - app-network

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: streamlit-app
    ports:
      - "8081:8081"
    volumes:
      - ./shared:/shared
    working_dir: /shared
    command: streamlit run /shared/streamlit.py --server.port=8081
    restart: unless-stopped
    networks:
      - app-network

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    container_name: jupyter-notebook
    ports:
      - "8082:8082"
    volumes:
      - ./shared:/shared
    working_dir: /shared
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: valkey/valkey:7.2
    command: "--requirepass '${REDIS_PASSWORD:-redispassword}'"
    healthcheck:
      test: "valkey-cli -a '${REDIS_PASSWORD:-redispassword}' -p ${REDIS_PORT:-6379} ping | grep -q PONG || exit 1"
      interval: 2s
      timeout: 1s
      retries: 3
      start_period: 5s
      start_interval: 5s
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: mariadb:10.11
    restart: always
    environment:
      - "MYSQL_USER=${MYSQL_USER:-misp}"
      - "MYSQL_PASSWORD=${MYSQL_PASSWORD:-example}"
      - "MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-password}"
      - "MYSQL_DATABASE=${MYSQL_DATABASE:-misp}"
    command: "\
      --innodb-buffer-pool-size=${INNODB_BUFFER_POOL_SIZE:-2048M} \
      --innodb-change-buffering=${INNODB_CHANGE_BUFFERING:-none} \
      --innodb-io-capacity=${INNODB_IO_CAPACITY:-1000} \
      --innodb-io-capacity-max=${INNODB_IO_CAPACITY_MAX:-2000} \
      --innodb-log-file-size=${INNODB_LOG_FILE_SIZE:-600M} \
      --innodb-read-io-threads=${INNODB_READ_IO_THREADS:-16} \
      --innodb-stats-persistent=${INNODB_STATS_PERSISTENT:-ON} \
      --innodb-write-io-threads=${INNODB_WRITE_IO_THREADS:-4}"
    volumes:
      - mysql_data:/var/lib/mysql
    cap_add:
      - SYS_NICE  # CAP_SYS_NICE Prevent runaway mysql log
    healthcheck:
      test: mysqladmin --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD status
      interval: 2s
      timeout: 1s
      retries: 3
      start_period: 30s
      start_interval: 5s
    networks:
      - app-network

  misp-core:
    image: ghcr.io/misp/misp-docker/misp-core:${CORE_RUNNING_TAG:-latest}
    cap_add:
      - AUDIT_WRITE
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: bash -c 'echo > /dev/tcp/127.0.0.1/9002' || exit 1
      interval: 2s
      timeout: 1s
      retries: 3
      start_period: 60s
      start_interval: 5s
    restart: unless-stopped
    expose:
      - "9002"
    networks:
      - app-network
    environment:
      - "BASE_URL=${BASE_URL:-http://localhost}"
      - "ENABLE_THEMES=true"

  misp-nginx:
    image: ghcr.io/misp/misp-docker/misp-nginx:${CORE_RUNNING_TAG:-latest}
    depends_on:
      misp-core:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-80}:8080"
    tmpfs:
      - /etc/nginx/conf.d:mode=0755,uid=101,gid=101
      - /var/cache/nginx:mode=0755,uid=101,gid=101
      - /tmp:mode=1777
    user: nginx
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - "BASE_URL=${BASE_URL:-http://localhost}"
      - "FASTCGI_LISTEN=misp-core:9002"
      - "FASTCGI_LISTEN_STATUS=misp-core:9003"
    networks:
      - app-network

volumes:
  jenkins_home:
  mysql_data:

networks:
  app-network:
    driver: bridge
