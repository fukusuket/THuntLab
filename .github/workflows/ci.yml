name: CI

# Verifies the root repository. The threatfeed-collector submodule has its own
# workflow and its own (currently red) baseline, so it is not checked out here.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Mirrors `make check` (AGENTS.md section 3). Kept as explicit steps so a
      # failure names the tier that broke.
      - name: Tier 0 - syntax
        run: python -m py_compile shared/hunt.py shared/streamlit.py

      - name: Tier 0 - compose config
        run: docker compose -f docker-compose.yml config -q

      - name: Tier 0 - Jenkins job XML
        run: python -c "import xml.etree.ElementTree as E, glob; [E.parse(p) for p in glob.glob('jobs/*/config.xml')]"

      - name: Tier 1 - tests
        run: python -m pytest tests/ -q

      - name: Guard - no secrets or reports committed
        run: |
          set -e
          if git ls-files --error-unmatch shared/authkey.txt 2>/dev/null; then
            echo "::error::shared/authkey.txt is tracked - it holds the MISP admin API key"; exit 1
          fi
          if git ls-files | grep -qE '(^|/)\.env$'; then
            echo "::error::a .env file is tracked"; exit 1
          fi
          if git ls-files | grep -q '^shared/report_.*\.md$'; then
            echo "::error::shared/report_*.md is tracked - LLM output over scraped article text"; exit 1
          fi
          echo "no secrets or generated reports tracked"
